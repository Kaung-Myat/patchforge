services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patchforge
      POSTGRES_PASSWORD: ${PATCHFORGE_DB_PASSWORD:?Database password is required}
      POSTGRES_DB: patchforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchforge -d patchforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  server:
    image: ${PATCHFORGE_SERVER_IMAGE:-ghcr.io/kaung-myat/patchforge-server:latest}
    user: "65532:65532"
    environment:
      DATABASE_URL: postgres://patchforge:${PATCHFORGE_DB_PASSWORD}@postgres:5432/patchforge
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      PATCHFORGE_KEY_ID: ${PATCHFORGE_KEY_ID:?Signing key ID is required}
      PATCHFORGE_PRIVATE_KEY_FILE: /run/secrets/patchforge_private_key
      PATCHFORGE_PRIVATE_KEY: ""
      PATCHFORGE_PUBLISH_TOKEN_HASHES: ${PATCHFORGE_PUBLISH_TOKEN_HASHES:?Publisher token hash is required}
      PATCHFORGE_STORAGE_DIR: /app/storage
      PATCHFORGE_MAX_ARTIFACT_SIZE_BYTES: ${PATCHFORGE_MAX_ARTIFACT_SIZE_BYTES:-104857600}
      PATCHFORGE_TRUST_PROXY: "true"
      PATCHFORGE_HTTPS_ENABLED: "true"
    secrets:
      - patchforge_private_key
    expose:
      - "8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    environment:
      PATCHFORGE_DOMAIN: ${PATCHFORGE_DOMAIN:?Domain is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  patchforge_private_key:
    file: ./secrets/signing-private-key
